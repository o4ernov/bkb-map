function at(d) { // точка на треке на расстоянии d метров от старта
  d = Math.max(0, Math.min(total, d));
  let lo = 0, hi = cum.length - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (cum[m] <= d) lo = m; else hi = m; }
  const t = (d - cum[lo]) / ((cum[hi] - cum[lo]) || 1);
  return [TRACK[lo][0] + (TRACK[hi][0] - TRACK[lo][0]) * t, TRACK[lo][1] + (TRACK[hi][1] - TRACK[lo][1]) * t];
}
function bearing(a, b) {
  const dl = (b[0] - a[0]) * rad;
  const y = Math.sin(dl) * Math.cos(b[1] * rad);
  const x = Math.cos(a[1] * rad) * Math.sin(b[1] * rad) - Math.sin(a[1] * rad) * Math.cos(b[1] * rad) * Math.cos(dl);
  return Math.atan2(y, x) / rad;
}
const lons = TRACK.map(p => p[0]), lats = TRACK.map(p => p[1]);
const bounds = [[Math.min(...lons), Math.min(...lats)], [Math.max(...lons), Math.max(...lats)]];

const map = new maplibregl.Map({
  container: 'map', center: [33.9, 44.56], zoom: 10, pitch: 60, bearing: -15, maxPitch: 85,
  style: {
    version: 8,
    sources: {
      topo: { type: 'raster', tiles: ['https://tile.opentopomap.org/{z}/{x}/{y}.png'], tileSize: 256, maxzoom: 17,
        attribution: '© OpenStreetMap contributors, SRTM | © OpenTopoMap (CC-BY-SA)' },
      sat: { type: 'raster', tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'], tileSize: 256, maxzoom: 18,
        attribution: 'Imagery © Esri, Maxar, Earthstar Geographics' },
      dem: { type: 'raster-dem', tiles: ['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'], encoding: 'terrarium', tileSize: 256, maxzoom: 15,
        attribution: 'Terrain: Mapzen / AWS Terrain Tiles' }
    },
    layers: [
      { id: 'topo', type: 'raster', source: 'topo' },
      { id: 'sat', type: 'raster', source: 'sat', layout: { visibility: 'none' } }
    ]
  }
});
map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'top-right');
map.addControl(new maplibregl.ScaleControl(), 'bottom-left');

map.on('load', () => {
  map.setTerrain({ source: 'dem', exaggeration: 1.5 });
  map.addSource('track', { type: 'geojson', data: { type: 'Feature', geometry: { type: 'LineString', coordinates: TRACK } } });
  const lay = { 'line-join': 'round', 'line-cap': 'round' };
  map.addLayer({ id: 'casing', type: 'line', source: 'track', layout: lay, paint: { 'line-color': '#ffffff', 'line-width': 6 } });
  map.addLayer({ id: 'line', type: 'line', source: 'track', layout: lay, paint: { 'line-color': '#e8412a', 'line-width': 3.2 } });
  for (let k = 10; k * 1000 < total; k += 10) {
    const e = document.createElement('div'); e.className = 'km'; e.textContent = k;
    new maplibregl.Marker({ element: e }).setLngLat(at(k * 1000)).addTo(map);
  }
  const s = document.createElement('div'); s.className = 'pin'; s.textContent = 'Старт / финиш';
  new maplibregl.Marker({ element: s, anchor: 'bottom', offset: [0, -4] }).setLngLat(TRACK[0]).addTo(map);
  showAll();
});

function showAll() {
  stopFly();
  map.fitBounds(bounds, { padding: 60, pitch: 60, bearing: -15, duration: 1500 });
}
function base(n) {
  map.setLayoutProperty('topo', 'visibility', n === 'topo' ? 'visible' : 'none');
  map.setLayoutProperty('sat', 'visibility', n === 'sat' ? 'visible' : 'none');
  $('bTopo').classList.toggle('on', n === 'topo');
  $('bSat').classList.toggle('on', n === 'sat');
}
$('bTopo').onclick = () => base('topo');
$('bSat').onclick = () => base('sat');
$('reset').onclick = showAll;
$('ex').oninput = e => {
  $('exv').textContent = e.target.value;
  map.setTerrain({ source: 'dem', exaggeration: +e.target.value });
};

// Облёт: камера едет вдоль трека и смотрит вперёд
let flying = false, raf, dist = 0, bear = 0, last = 0;
const SPEED = 700; // метров в секунду, весь маршрут примерно за 3 минуты
function stopFly() {
  flying = false; cancelAnimationFrame(raf);
  $('fly').textContent = 'Облёт'; $('fly').classList.remove('on');
  if (typeof clearCursor === 'function') clearCursor();
}
function step(t) {
  if (!flying) return;
  const dt = Math.min((t - last) / 1000, 0.1); last = t;
  dist += SPEED * dt;
  if (dist >= total) { showAll(); return; }
  const p = at(dist), b = bearing(p, at(dist + 1500));
  bear += (((b - bear + 540) % 360) - 180) * Math.min(1, dt * 1.5);
  map.jumpTo({ center: p, bearing: bear, pitch: 68, zoom: 13 });
  setCursor(dist);
  raf = requestAnimationFrame(step);
}
$('fly').onclick = () => {
  if (flying) { stopFly(); return; }
  flying = true; dist = 0; bear = bearing(at(0), at(1500));
  $('fly').textContent = 'Стоп'; $('fly').classList.add('on');
  map.jumpTo({ center: at(0), bearing: bear, pitch: 68, zoom: 13 });
  last = performance.now(); raf = requestAnimationFrame(step);
};
map.on('mousedown', () => { if (flying) stopFly(); });
map.on('touchstart', () => { if (flying) stopFly(); });

// ---------- Профиль высот ----------
// В GPX высот нет, поэтому берём их из той же модели рельефа (AWS Terrain Tiles, Terrarium).
const STEP = 100, N = Math.floor(total / STEP) + 1, XMAX = (N - 1) * STEP, Z = 12;
const cv = $('cv'), ctx = cv.getContext('2d'), tip = $('tip');
const DATA = {}, TL = {};
let elev = null, cursor = null, dot = null, G = { L: 40, w: 1 };

function gxy(p) {
  const n = 2 ** Z, s = Math.sin(p[1] * rad);
  return [(p[0] + 180) / 360 * n * 256, (0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)) * n * 256];
}
function tile(x, y) {
  const k = x + '/' + y;
  if (!TL[k]) TL[k] = (async () => {
    const r = await fetch(`https://s3.amazonaws.com/elevation-tiles-prod/terrarium/${Z}/${x}/${y}.png`);
    if (!r.ok) throw new Error('tile ' + k);
    const bmp = await createImageBitmap(await r.blob(), { colorSpaceConversion: 'none' });
    const c = document.createElement('canvas'); c.width = c.height = 256;
    const g = c.getContext('2d'); g.drawImage(bmp, 0, 0);
    DATA[k] = g.getImageData(0, 0, 256, 256).data;
  })();
  return TL[k];
}
function px(gx, gy) {
  const tx = Math.floor(gx / 256), ty = Math.floor(gy / 256), d = DATA[tx + '/' + ty];
  const i = ((gy - ty * 256) * 256 + (gx - tx * 256)) * 4;
  return d[i] * 256 + d[i + 1] + d[i + 2] / 256 - 32768;
}
function elevation(p) {
  const g = gxy(p), gx = g[0] - 0.5, gy = g[1] - 0.5, x = Math.floor(gx), y = Math.floor(gy), fx = gx - x, fy = gy - y;
  return px(x, y) * (1 - fx) * (1 - fy) + px(x + 1, y) * fx * (1 - fy) + px(x, y + 1) * (1 - fx) * fy + px(x + 1, y + 1) * fx * fy;
}
async function loadProfile() {
  try {
    const pts = [];
    for (let i = 0; i < N; i++) pts.push(at(i * STEP));
    const need = new Set();
    pts.forEach(p => {
      const g = gxy(p), x = Math.floor(g[0] - 0.5), y = Math.floor(g[1] - 0.5);
      for (const dx of [0, 1]) for (const dy of [0, 1]) need.add(Math.floor((x + dx) / 256) + '/' + Math.floor((y + dy) / 256));
    });
    await Promise.all([...need].map(k => { const [x, y] = k.split('/'); return tile(+x, +y); }));
    const raw = pts.map(elevation);
    elev = raw.map((_, i) => { let s = 0, c = 0; for (let j = i - 2; j <= i + 2; j++) if (j >= 0 && j < N) { s += raw[j]; c++; } return s / c; });
    let up = 0, dn = 0, ref = elev[0];
    for (const e of elev) { if (e - ref >= 3) { up += e - ref; ref = e; } else if (ref - e >= 3) { dn += ref - e; ref = e; } }
    const r10 = v => Math.round(v / 10) * 10;
    $('stats').textContent = `Набор ≈ ${r10(up)} м · Спуск ≈ ${r10(dn)} м · Макс. ${Math.round(Math.max(...elev))} м · Мин. ${Math.round(Math.min(...elev))} м (по модели рельефа)`;
    draw();
  } catch (err) {
    $('stats').textContent = 'Не удалось загрузить высоты для профиля';
  }
}
function elevAt(d) {
  const f = Math.max(0, Math.min(N - 1, d / STEP)), i = Math.floor(f), j = Math.min(N - 1, i + 1);
  return elev[i] + (elev[j] - elev[i]) * (f - i);
}
function draw() {
  const dpr = window.devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
  if (!elev) return;
  const cs = getComputedStyle(document.documentElement), fg = cs.getPropertyValue('--fg').trim(), ac = cs.getPropertyValue('--accent').trim();
  const L = 40, Rr = 12, T = 10, B = 22, w = W - L - Rr, h = H - T - B;
  G = { L, w };
  const mn = Math.min(...elev), mx = Math.max(...elev), st = (mx - mn) > 600 ? 200 : 100;
  const y0 = Math.floor(mn / st) * st, y1 = Math.ceil(mx / st) * st;
  const X = d => L + d / XMAX * w, Y = e => T + h - (e - y0) / (y1 - y0) * h;
  ctx.font = '11px system-ui,sans-serif'; ctx.fillStyle = fg; ctx.lineWidth = 1;
  ctx.textBaseline = 'middle'; ctx.textAlign = 'right';
  for (let v = y0; v <= y1; v += st) {
    ctx.strokeStyle = fg + '26'; ctx.beginPath(); ctx.moveTo(L, Y(v)); ctx.lineTo(L + w, Y(v)); ctx.stroke();
    ctx.fillText(v, L - 6, Y(v));
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  for (let k = 0; k * 1000 <= XMAX; k += 10) {
    ctx.strokeStyle = fg + '14'; ctx.beginPath(); ctx.moveTo(X(k * 1000), T); ctx.lineTo(X(k * 1000), T + h); ctx.stroke();
    ctx.fillText(k + ' км', Math.min(X(k * 1000), W - 18), H - 6);
  }
  const grad = ctx.createLinearGradient(0, T, 0, T + h);
  grad.addColorStop(0, ac + '77'); grad.addColorStop(1, ac + '11');
  ctx.beginPath(); ctx.moveTo(X(0), Y(y0));
  elev.forEach((e, i) => ctx.lineTo(X(i * STEP), Y(e)));
  ctx.lineTo(X(XMAX), Y(y0)); ctx.closePath(); ctx.fillStyle = grad; ctx.fill();
  ctx.beginPath(); elev.forEach((e, i) => i ? ctx.lineTo(X(i * STEP), Y(e)) : ctx.moveTo(X(0), Y(e)));
  ctx.strokeStyle = ac; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.stroke();
  if (cursor === null) { tip.style.display = 'none'; return; }
  const cx = X(cursor), e = elevAt(cursor);
  ctx.strokeStyle = fg + '99'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(cx, T); ctx.lineTo(cx, T + h); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, Y(e), 5, 0, 7); ctx.fillStyle = ac; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
  const i = Math.round(cursor / STEP), a = Math.max(0, i - 1), b = Math.min(N - 1, i + 1);
  const slope = (elev[b] - elev[a]) / ((b - a) * STEP) * 100;
  tip.textContent = `${(cursor / 1000).toFixed(1).replace('.', ',')} км · ${Math.round(e)} м · уклон ${Math.round(slope)}%`;
  tip.style.display = 'block';
  tip.style.left = (cx > W / 2 ? cx - tip.offsetWidth - 10 : cx + 10) + 'px';
}
function setCursor(d) {
  if (!elev) return;
  cursor = Math.max(0, Math.min(XMAX, d));
  if (!dot) { const e = document.createElement('div'); e.className = 'dot'; dot = new maplibregl.Marker({ element: e }).setLngLat(at(cursor)).addTo(map); }
  else dot.setLngLat(at(cursor));
  draw();
}
function clearCursor() {
  cursor = null; if (dot) { dot.remove(); dot = null; }
  draw();
}
function distFromEvent(e) { const r = cv.getBoundingClientRect(); return (e.clientX - r.left - G.L) / G.w * XMAX; }
cv.addEventListener('pointermove', e => { if (flying) return; const d = distFromEvent(e); if (d >= 0 && d <= XMAX) setCursor(d); });
cv.addEventListener('pointerdown', e => { if (flying) return; const d = distFromEvent(e); if (d >= 0 && d <= XMAX) setCursor(d); });
cv.addEventListener('pointerleave', () => { if (!flying) clearCursor(); });
cv.addEventListener('click', () => { if (cursor !== null && !flying) map.easeTo({ center: at(cursor), zoom: 12.5, pitch: 65, duration: 1200 }); });
new ResizeObserver(draw).observe(cv);
loadProfile();
</script>
</body>
</html>
